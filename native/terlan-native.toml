[package]
namespace = "pytorch"
adapter = "cxx"
crate = "terlan-pytorch-cxx"

[cpp_metadata]
schema = "terlan.cpp.metadata.v1"
producer = "clang-libtooling"
format = "normalized-ast-json"
target = "x86_64-pc-linux-gnu"
language_standard = "c++17"
mapping_schema = "terlan.cpp.mapping.v1"

[public_adapter]
adapter_abi_version = 1
target = "x86_64-pc-linux-gnu"
calling_convention = "system_v"
execution_context = "explicit"
ownership = "opaque_handles"
capability_lifetimes = "explicit"
resource_lifetimes = "execution_context_scoped"
max_frame_bytes = 1048576
max_transfer_bytes = 16777216
status_model = "status_values"
callback_reentrancy = "forbidden"
async_completion = "single_shot"
handle_scope = "worker_random_256"
cross_owner = "reject"
raw_pointers = false
exceptions_cross_boundary = false
null_failure = "generic_null"
native_failure_payloads = false

