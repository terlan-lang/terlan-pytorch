[package]
name = "terlan-pytorch-cxx"
version = "0.0.0"
namespace = "pytorch"

[build]
source_roots = ["src"]
artifact = "library"

[dependencies]
ndarray = { path = "../terlan-ndarray" }

[native.rust]
crate = "terlan-pytorch-cxx"
path = "native/rust"
helper = "native-boundary-helper"
helper_env = "TERLAN_PYTORCH_NATIVE_BOUNDARY_HELPER_PATH"
